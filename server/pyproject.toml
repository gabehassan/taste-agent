[project]
name = "tasteserver"
version = "0.1.0"
description = "API and worker for taste, an iMessage agent that learns what you like"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "openai>=1.60",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "yt-dlp>=2025.1.1",
    "boto3>=1.35",
    "feedparser>=6.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tasteserver*"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# SQL and prompt strings stay on one line so they can be read and grepped whole.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
